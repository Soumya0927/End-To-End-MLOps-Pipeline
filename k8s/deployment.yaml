apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-detection-api
  namespace: oppe2-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraud-detection-api
  template:
    metadata:
      labels:
        app: fraud-detection-api
    spec:
      serviceAccountName: telemetry-access
      containers:
        - name: fraud-detection-api
          image: us-central1-docker.pkg.dev/ultra-guard-461512-j0/ml-artifacts/fraud-detection-api:latest
          ports:
            - containerPort: 8200
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          env:
            - name: MODEL_PATH
              value: "dt_model.joblib"


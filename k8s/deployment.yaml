apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-detector-deployment
  labels:
    app: fraud-detector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraud-detector
  template:
    metadata:
      labels:
        app: fraud-detector
    spec:
      serviceAccountName: telemetry-access
      containers:
        - name: fraud-detector
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8200
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          env:
            - name: MODEL_PATH
              value: "dt_model.joblib"

